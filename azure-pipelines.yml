# Sample YML pipeline for X++ builds
# For more information on build pipelines, see
# https://docs.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/dev-tools/hosted-build-automation

# Change the name of the build to a 4-digit version number to be used for model versioning
name: $(Date:yy.MM.dd)$(Rev:.r)
trigger: none

# Cron Schedules have been converted using UTC Time Zone and may need to be updated for your location
schedules:
- cron: 40 23 * * 3
  branches:
    include:
    - dev

pool:
# Use the VS2019 image
  vmImage: 'windows-2019'
  demands:
    - msbuild
    - visualstudio
  
# Declare some shorthand for NuGet package names
# Make editing the path for metadata and NuGet extraction folder easier
variables:
 # SendGridKey: ''    --APIKey has stored in the variable group SendGridKey
- group: SendGridKey
 # Email notification variables are from group : CoreBuild_EmailNotifcation_dev
- group:  CoreBuild_EmailNotifcation_dev
 # - name: SenderEmail
 # value: 'noReply.CBRelease@metcash.com'
 # - name: mailNotificationGroup_BuildFailed
 #  value: 'HorizonCoreBuildTeam@metcash.onmicrosoft.com,environmentteam@metcash.com'
 # - name: EmailNotificationGroup_BuildSuccess
 #  value: 'D365_EnvOtageN@metcash.com,HorizonCoreBuildTeam@metcash.onmicrosoft.com,environmentteam@metcash.com'
- name: App1Package
  value: 'Microsoft.Dynamics.AX.Application1.DevALM.BuildXpp'
- name: App2Package
  value: 'Microsoft.Dynamics.AX.Application2.DevALM.BuildXpp'
- name: AppSuitePackage
  value: 'Microsoft.Dynamics.AX.ApplicationSuite.DevALM.BuildXpp'
- name: PlatPackage
  value: 'Microsoft.Dynamics.AX.Platform.DevALM.BuildXpp'
- name: ToolsPackage
  value: 'Microsoft.Dynamics.AX.Platform.CompilerPackage'
- name: MetadataPath
  value: '$(Build.SourcesDirectory)\Metadata'
- name: NugetConfigsPath
  value: '$(Build.SourcesDirectory)\Configuration'
- name: NugetsPath
  value: '$(Pipeline.Workspace)\NuGets'



steps:
# Install NuGet and use -ExcludeVersion option to avoid paths containing version numbers
- task: NuGetCommand@2
  displayName: 'NuGet custom install Packages'
  inputs:
    command: custom
    arguments: 'install -Noninteractive $(NugetConfigsPath)\packages.config -ConfigFile $(NugetConfigsPath)\nuget.config -Verbosity Detailed -ExcludeVersion -OutputDirectory "$(NugetsPath)"'

# Use the custom build number y.m.d.rev as the model version
# Default updates only VAR layer and above
- task: XppUpdateModelVersion@0
  displayName: 'Update Model Version'
  inputs:
    XppSourcePath: '$(MetadataPath)'
    VersionNumber: '$(Build.BuildNumber)'

# Copy binary dependencies
- task: CopyFiles@2
  displayName: 'Copy Binary Dependencies to: $(Build.BinariesDirectory)'
  inputs:
    SourceFolder: $(MetadataPath)
    Contents:  |
     **\KPMGPoweredEnterprise\**
     **\KPMGPoweredFinance\**
     **\MonitoringandTelemetry\**
     **\FPAssure\**
     **\FPAuditTrail\**
     **\FPSecurityDesigner\**
     **\FPQuantification\**
     **\Kyriba\**
     **\BlacklineModel\**
    TargetFolder: '$(Build.BinariesDirectory)'
    
# Build using MSBuild 16 (VS 2019)
# Provide the needed paths, including semi-colon separated list of reference folders
# /p:ReferenceFolder are metadata folders containing other (compiled) X++ packages that are referenced
# /p:ReferencePath are folders containing non-X++ assemblies referenced (aside from one already in the output folder for the package)
- task: VSBuild@1
  displayName: 'Build solution **\*.sln'
  inputs:
    solution: '$(Build.SourcesDirectory)\Build\D365Build\D365Build.sln'
    vsVersion: '16.0'
    msbuildArgs: '/p:BuildTasksDirectory="$(NugetsPath)\$(ToolsPackage)\DevAlm" /p:MetadataDirectory="$(MetadataPath)" /p:FrameworkDirectory="$(NuGetsPath)\$(ToolsPackage)" /p:ReferenceFolder="$(NuGetsPath)\$(PlatPackage)\ref\net40;$(NuGetsPath)\$(App1Package)\ref\net40;$(NuGetsPath)\$(App2Package)\ref\net40;$(NuGetsPath)\$(AppSuitePackage)\ref\net40;$(MetadataPath);$(Build.BinariesDirectory)" /p:ReferencePath="$(NuGetsPath)\$(ToolsPackage)" /p:OutputDirectory="$(Build.BinariesDirectory)"'

# Copy the compiler log files to the drop artifacts
- task: CopyFiles@2
  displayName: 'Copy X++ Compile Log Files to: $(Build.ArtifactStagingDirectory)\Logs'
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)'
    Contents: |
      **\Dynamics.AX.*.xppc.*
      **\Dynamics.AX.*.labelc.*
      **\Dynamics.AX.*.reportsc.*
    TargetFolder: '$(build.ArtifactStagingDirectory)\Logs'
  condition: succeededOrFailed()

# For packaging we need NuGet installed, with a version <3.4.0
- task: NuGetToolInstaller@0
  displayName: 'Use NuGet 3.3.0'
  inputs:
    versionSpec: 3.3.0

- task: XppCreatePackage@0
  displayName: 'Create Deployable Package'
  inputs:
    XppToolsPath: '$(NuGetsPath)\$(ToolsPackage)'

# Enable this task to add a license file to the package
- task: XppAddLicenseToPackage@0
  displayName: 'Add Licenses to Deployable Package'
  enabled: false

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: drop'
  inputs:
    PathtoPublish: '$(build.artifactstagingdirectory)'
  condition: succeededOrFailed()

# Email notification for the scheduled envrionment update by relelase
- task: SendGridEmail@2
  inputs:
    SendGridApiKey: '$(SendGridKey)'
    FromAddress: '$(SenderEmail)'
    ToAddresses: '$(EmailNotificationGroup_BuildSuccess)'
    Subject: 'SCHEDULED OUTAGE FOR D365-Core Build Environments tonight at 11:30 pm AEST'
    emailBodyFormat: 'InLine'
    EmailBody: |
      Hi All,
      
      
              The lastest CoreBuild Package (AXDeployableRuntime_$(Build.BuildNumber).zip) has been built successfully.
      
      
              Deployment to the following D365 Environments will begin at 11:30pm tonight:
               Metcash-CB-DEV05, Metcash-CB-PRICE01, Metcash-PP-PRICE,Metcash-PP-BASEDEV, Metcash-PP-IOMDEV02, Metcash-PP-DEV02,Metcash-PP-QA,Metcash-DM10,Metcash-DM-DEV01,Metcash-DM-DEV02,Metcash-RP-DEV01
      
              Please refer to the following link for the Release notes:
      
              https://metcash.atlassian.net/wiki/spaces/EM/pages/1611727119/Core+Build+Release+Notes
      
      
              Thanks


# Email notification for the Pipeline run failure
- task: SendGridEmail@2
  displayName: SendGrid Email notification for the build error
  condition: failed()
  inputs:
    SendGridApiKey: '$(SendGridKey)'
    FromAddress: '$(SenderEmail)'
    ToAddresses: '$(EmailNotificationGroup_BuildFailed)'
    Subject: 'Error in the Pipeline build for the CoreBuildTest Package (AXDeployableRuntime_$(Build.BuildNumber).zip). Please check!'
    emailBodyFormat: 'InLine'
    EmailBody: |
      Hi All,
        
      The pipeline build for the CoreBuildTest Package (AXDeployableRuntime_$(Build.BuildNumber).zip) has encountered an error.  
      Please fix it and restart the pipeline. 
      
      
      Thanks