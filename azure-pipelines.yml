# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml



trigger:
- none

# Declare variables
variables:
  AppPackage: 'Microsoft.Dynamics.AX.Application1.DevALM.BuildXpp'
  AppPackage2: 'Microsoft.Dynamics.AX.Application2.DevALM.BuildXpp'
  AppSuitePackage: 'Microsoft.Dynamics.AX.ApplicationSuite.DevALM.BuildXpp'
  EmailNotificationGroup_BuildFailed: 'HorizonCoreBuildTeam@metcash.onmicrosoft.com,environmentteam@metcash.com'
  EmailNotificationGroup_BuildSuccess: 'D365_EnvOtageN@metcash.com,HorizonCoreBuildTeam@metcash.onmicrosoft.com,environmentteam@metcash.com'
  MetadataPath: '$(Build.SourcesDirectory)\Metadata'
  NugetConfigsPath: '$(Build.SourcesDirectory)\Configuration'
  NugetsPath: '$(Pipeline.Workspace)\NuGets'
  PlatPackage: 'Microsoft.Dynamics.AX.Platform.DevALM.BuildXpp'
  SenderEmail: 'noReply.CBRelease@metcash.com'
  SendGridKey: '' 
  ToolsPackage: 'Microsoft.Dynamics.AX.Platform.CompilerPackage'

# Cron Schedules have been converted using UTC Time Zone and may need to be updated for your location
schedules:
- cron: 0 11 * * 5
  branches:
    include:
    - $/Horizon Core Build
name: $(Date:dd.MM.yy)$(Rev:.r)

resources:
  repositories:
  - repository: self
    type: git
    ref: $/Horizon Core Build
jobs:
- job: XppCompileJob
  displayName: Compile X++
  timeoutInMinutes: 360
  pool:
    vmImage: windows-2019
    demands:
      - msbuild
      - visualstudio
  steps:
  - checkout: self
    clean: true   
  - task: NuGetInstaller@0
    displayName: NuGet install Packages
    enabled: False
    inputs:
      solution: $(NugetConfigsPath)\packages.config
      nugetConfigPath: $(NugetConfigsPath)\nuget.config
      restoreMode: install
      noCache: true
      nuGetRestoreArgs: -ExcludeVersion -OutputDirectory "$(NugetsPath)"
      verbosity: Detailed
      nuGetVersion: 4.0.0.2283
  - task: NuGetCommand@2
    displayName: NuGet custom
    inputs:
      command: custom
      arguments: install -Noninteractive $(NugetConfigsPath)\packages.config -ConfigFile $(NugetConfigsPath)\nuget.config -Verbosity Detailed -ExcludeVersion -OutputDirectory "$(NugetsPath)"
  - task: Dyn365FinOps.dynamics365-finops-tools.finops-updatemodelversion.XppUpdateModelVersion@0
    displayName: Update Model Version
    inputs:
      XppSourcePath: $(MetadataPath)
  - task: CopyFiles@2
    displayName: 'Copy Binary Dependencies to: $(Build.BinariesDirectory)'
    inputs:
      SourceFolder: $(MetadataPath)
      Contents: >-
        **\KPMGPoweredEnterprise\**

        **\KPMGPoweredFinance\**

        **\FPAssure\**

        **\FPAuditTrail\**

        **\FPSecurityDesigner\**

        **\FPQuantification\**

        **\Kyriba\**

        **\WalkMe\**
      TargetFolder: $(Build.BinariesDirectory)
  - task: VSBuild@1
    displayName: Build solution **\\D365Build.sln
    inputs:
      solution: '**\\D365Build.sln'
      vsVersion: '16.0'
      msbuildArgs: '/p:BuildTasksDirectory="$(NugetsPath)\$(ToolsPackage)\DevAlm" /p:MetadataDirectory="$(MetadataPath)" /p:FrameworkDirectory="$(NuGetsPath)\$(ToolsPackage)" /p:ReferenceFolder="$(NuGetsPath)\$(PlatPackage)\ref\net40;$(NuGetsPath)\$(AppPackage1)\ref\net40; $(NuGetsPath)\$(AppPackage2)\ref\net40 ;$(NuGetsPath)\$(AppSuitePackage)\ref\net40;$(MetadataPath);$(Build.BinariesDirectory)" /p:ReferencePath="$(NuGetsPath)\$(ToolsPackage)" /p:OutputDirectory="$(Build.BinariesDirectory)"'
  - task: CopyFiles@2
    displayName: 'Copy X++ Compile Log Files to: $(Build.ArtifactStagingDirectory)\Logs'
    condition: succeededOrFailed()
    inputs:
      SourceFolder: $(Build.SourcesDirectory)
      Contents: >-
        **\Dynamics.AX.*.xppc.*

        **\Dynamics.AX.*.labelc.*

        **\Dynamics.AX.*.reportsc.*
      TargetFolder: $(Build.ArtifactStagingDirectory)\Logs
  - task: NuGetToolInstaller@0
    displayName: Use NuGet 3.3.0
    inputs:
      versionSpec: 3.3.0
  - task: Dyn365FinOps.dynamics365-finops-tools.finops-createpackage.XppCreatePackage@0
    displayName: Create Deployable Package
    inputs:
      XppToolsPath: $(NuGetsPath)\$(ToolsPackage)
  - task: Dyn365FinOps.dynamics365-finops-tools.finops-addlicensetopackage.XppAddLicenseToPackage@0
    displayName: Add Licenses to Deployable Package
    enabled: False
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact: drop'
    condition: succeededOrFailed()
    inputs:
      PathtoPublish: $(build.artifactstagingdirectory)
      TargetPath: '\\my\share\$(Build.DefinitionName)\$(Build.BuildNumber)'
  - task: kasunkodagoda.sendgrid-email.sendgrid-email.SendGridEmail@2
    displayName: SendGrid Email notification to group after build success
    inputs:
      SendGridApiKey: $(SendGridKey)
      FromAddress: $(SenderEmail)
      ToAddresses: $(EmailNotificationGroup_BuildSuccess)
      Subject: SCHEDULED OUTAGE FOR D365-Core Build Environments tonight at 11:30 pm AEST
      EmailBody: >-
        Hi All,


        The lastest CoreBuild Package (AXDeployableRuntime_$(Build.BuildNumber).zip) has been built successfully.


        Deployment to the following D365 Environments will begin at 11:30pm tonight:
         Metcash-CB-DEV05, Metcash-CB-PRICE01, Metcash-PP-PRICE,Metcash-PP-BASEDEV, Metcash-PP-IOMDEV02, Metcash-PP-DEV02,Metcash-PP-QA,Metcash-DM10,Metcash-DM-DEV01,Metcash-DM-DEV02,Metcash-RP-DEV01

        Please refer to the following link for the Release notes:

        https://metcash.atlassian.net/wiki/spaces/EM/pages/1611727119/Core+Build+Release+Notes


        Thanks
  - task: kasunkodagoda.sendgrid-email.sendgrid-email.SendGridEmail@2
    displayName: SendGrid Email notification for the build error
    condition: failed()
    inputs:
      SendGridApiKey: $(SendGridKey)
      FromAddress: $(SenderEmail)
      ToAddresses: $(EmailNotificationGroup_BuildFailed)
      Subject: Error in the Pipeline build for the CoreBuildTest Package (AXDeployableRuntime_$(Build.BuildNumber).zip). Please check!
      EmailBody: "Hi All,\n  \nThe pipeline build for the CoreBuildTest Package (AXDeployableRuntime_$(Build.BuildNumber).zip) has encountered an error.  \nPlease fix it and restart the pipeline. \n\n\nThanks"
...
